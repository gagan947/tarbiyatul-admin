<div class="login-wrapper">
  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="right-inner">
      <div class="form-area">
        <!-- Logo -->
        <div class="logo-wrap text-center ct_mb_56">
          <img src="/assets/img/logo.png" alt="Logo" />
        </div>

        <!-- Heading -->
        <h1 class="text-center ct_fs_40 ct_fw_300 ct_lh_1 ct_mb_16 ct_ff_Rowdies">Forgot Password</h1>
        <p class="text-center ct_text_para ct_fs_14 ct_mb_56">Don’t worry it happens, please enter the email associated with your account.</p>

        <!-- Feedback Alert Boxes -->
        <div *ngIf="errorMessage" class="alert alert-danger mb-4 ct_fs_14 py-2 px-3 border-0" role="alert"
          style="background-color: #fcebeb; color: #d93838; border-radius: 8px;">
          <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="alert alert-success mb-4 ct_fs_14 py-2 px-3 border-0" role="alert"
          style="background-color: #e6fdf0; color: #107c41; border-radius: 8px;">
          <i class="fa-solid fa-circle-check me-2"></i> {{ successMessage }}
        </div>

        <!-- Form -->
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
          <!-- Email Input -->
          <div class="ct_mb_12">
            <label class="form-label ct_form_label mb-2" for="email">Email</label>
            <input type="email" id="email" formControlName="email" class="form-control ct_login_input" [class.is-invalid]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid" placeholder="Enter your email" autocomplete="email" />
            
            <div *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid" class="text-danger mt-2 ct_fs_13 d-flex align-items-center gap-1">
              <i class="fa-solid fa-circle-info"></i>
              <span *ngIf="forgotForm.get('email')?.errors?.['required']">Email is required.</span>
              <span *ngIf="forgotForm.get('email')?.errors?.['email']">Please enter a valid email address.</span>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-signin ct_mt_40 ct_mb_56 w-100 d-flex align-items-center justify-content-center gap-2" [disabled]="isLoading" style="cursor: pointer;">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            {{ isLoading ? 'Sending...' : 'Send OTP' }}
          </button>
        </form>

        <!-- Back to Login -->
        <div class="text-center ct_fs_14">
          Already Know Your Password? 
          <a routerLink="/login" class="forgot-link">Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <!-- LEFT PANEL -->
  <div class="left-panel d-none d-lg-block">
    <img class="login-img" src="/assets/img/login.png" alt="login-img" />
  </div>
</div>
