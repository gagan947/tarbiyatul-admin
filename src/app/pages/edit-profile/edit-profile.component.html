<div class="ct_inner_header_bg mt-4 mb-5 ct_px_28">
  <div class="ct_main_head mb-4">
    <h4 class="ct_fs_24 ct_fw_300 mb-1">Edit Profile</h4>
    <p class="ct_fs_16 ct_fw_400 ct_text_para mb-0">Update your administrator account information</p>
  </div>

  <div class="ct_mt_50 bg-white ct_border_10 ct_box_shadow_25 ct_p_30 ct_576_p_20">
    <form action="" (submit)="$event.preventDefault()">
      <div class="d-flex align-items-center flex-wrap gap-4">
        <div class="ct_profile_img">
          <img src="assets/img/user-f.jpg" alt="Fatima Ahmed" />
          <label for="ct_profile_update">
            <input type="file" class="d-none" id="ct_profile_update" />
            <div class="ct_upload_icon">
              <i class="fa-solid fa-camera"></i>
            </div>
          </label>
        </div>
        <div>
          <h4 class="ct_fs_18 ct_fw_300 mb-0 text-break">Fatima Ahmed</h4>
          <p class="ct_fs_14 mb-0 ct_text_para text-break">sarawilliam029&#64;gmail.com</p>
        </div>
      </div>
      <div class="mt-5 row">
        <div class="col-lg-6">
          <div class="form-group mb-3">
            <label for="" class="ct_form_label">Full Name</label>
            <input type="text" class="form-control ct_input ct_fs_14" placeholder="Enter Full Name" value="Fatima Ahmed" />
          </div>
        </div>
        <div class="col-lg-6">
          <div class="form-group mb-3">
            <label for="" class="ct_form_label">Email Id <span class="text-grey">(non-editable)</span></label>
            <input readonly type="email" class="form-control ct_input ct_fs_14" placeholder="Enter Email Address" value="ahmedkhan&#64;email.com" />
          </div>
        </div>
      </div>
    </form>

    <div class="d-flex ct_flex_col_575 gap-2 justify-content-end ct_mt_45">
      <button routerLink="/dashboard" class="ct_transparent_btn ct_width_100_575">Cancel</button>
      <button routerLink="/dashboard" class="ct_gradient_btn ct_width_100_575">Save Changes</button>
    </div>
  </div>
</div>
